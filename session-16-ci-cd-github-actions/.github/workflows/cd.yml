name: Final CD Pipeline

on:
  workflow_run:
    workflows: ["Final CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t calculator-app:staging-${{ github.sha }} .
          echo "Docker image built successfully for staging environment."

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying calculator-app:staging-${{ github.sha }} to Staging Cluster..."
          echo "Health check passed. Staging deployment SUCCESS."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        run: |
          echo "Promoting staging build to Production Cluster..."
          echo "Production rollout completed successfully."
