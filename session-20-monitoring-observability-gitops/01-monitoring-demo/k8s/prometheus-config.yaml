apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

  alert_rules.yml: |
    groups:
      - name: application_alerts
        rules:
          - alert: HighCPUUtilization
            expr: sum(rate(container_cpu_usage_seconds_total{container="app"}[2m])) by (pod) / sum(container_spec_cpu_quota/100000) by (pod) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected on Pod {{ $labels.pod }}"
              description: "CPU usage exceeds 80% threshold for > 2 minutes."

          - alert: HighMemoryUsage
            expr: container_memory_working_set_bytes{container="app"} / container_spec_memory_limit_bytes > 0.85
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Memory usage critical on Pod {{ $labels.pod }}"
              description: "Pod memory exceeds 85% of configured limit (OOM risk)."

          - alert: AppHealthCheckFailure
            expr: probe_success{job="blackbox"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Application health check failure"
              description: "Application endpoint returned non-200 status."
