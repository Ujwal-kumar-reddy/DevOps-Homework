name: Complete DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ========================================
  # STAGE 1 — Unit Testing & Coverage
  # ========================================
  test:
    name: 🧪 Unit Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute pytest with coverage report
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

  # ========================================
  # STAGE 2 — SAST (Static Application Security Testing)
  # ========================================
  sast:
    name: 🔍 SAST Code Analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ========================================
  # STAGE 3 — SCA (Software Composition Analysis)
  # ========================================
  sca:
    name: 🛡️ SCA Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run SCA Dependency Audit
        run: |
          pip-audit

  # ========================================
  # STAGE 4 — Secret Scanning
  # ========================================
  secret-scan:
    name: 🔑 Secret & Credential Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan Gate
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ========================================
  # STAGE 5 — Docker Image Build
  # ========================================
  docker-build:
    name: 🐳 Docker Container Build
    needs: [test, sast, sca, secret-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

  # ========================================
  # STAGE 6 — Container Image Security Gate (Trivy)
  # ========================================
  image-scan:
    name: 🔒 Container Image Vulnerability Scan & Gate (Trivy)
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: |
          docker build -t session17-python:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner (CRITICAL / HIGH Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: session17-python:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ========================================
  # STAGE 7 — Push to Container Registry (GHCR)
  # ========================================
  push:
    name: 📤 Publish Container to GHCR
    needs: [image-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

  # ========================================
  # STAGE 8 — Kubernetes Deployment & Rollout Verification
  # ========================================
  deploy:
    name: ☸️ Automated Kubernetes Deployment
    needs: [push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kind Cluster for Deployment Verification
        uses: helm/kind-action@v1.10.0

      - name: Update Deployment Image Tag
        run: |
          sed -i "s|ghcr.io/iamab/session17-devsecops:latest|ghcr.io/${{ github.repository }}:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/session17-python --timeout=90s
          kubectl get pods -o wide
          kubectl get svc session17-python

      - name: Smoke Test Live Application
        run: |
          kubectl port-forward svc/session17-python 5001:5001 &
          sleep 4
          curl -s http://localhost:5001/health
          curl -s http://localhost:5001/api/status
